version: "3.9"

services:

  backend:
    build:
      context: ../backend
    image: ohksj77/gitrank-backend
    container_name: gitrank-backend
    ports:
      - 8080:8080
    networks:
      - app-tier
    depends_on:
      - db
      - kafka
    restart: on-failure
    tty: true

  db:
    image: mysql
    container_name: gitrank-db
    restart: on-failure
    ports:
      - 3307:3306
    volumes:
      - data_mysql:/var/lib/mysql
    env_file:
      - .env
    networks:
      - app-tier
    tty: true

  redis:
    image: redis:latest
    container_name: gitrank-redis
    restart: on-failure
    ports:
      - 6379:6379
    networks:
      - app-tier
    tty: true

  nginx:
    build: ./nginx
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/log:/var/log/nginx
    container_name: nginx
    networks:
      - app-tier
    depends_on:
      - backend
      - scraping
    tty: true

networks:
  app-tier:
    driver: bridge

volumes:
  data_mysql: null
